<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <title>Trade History · Anchor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy-deep: #0F1A2E; --navy: #1B2A4A; --navy-light: #253A5E;
      --silver: #A0A7B4; --success: #2ECC71; --danger: #E74C3C;
      --bg: #F4F6F9; --card-bg: #FFFFFF; --text-primary: #1A1D23;
      --text-secondary: #6B7280; --radius-lg: 16px;
      --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 6px 16px rgba(0,0,0,0.04);
      --shadow-card-hover: 0 2px 6px rgba(0,0,0,0.06), 0 12px 24px rgba(0,0,0,0.06);
      --transition: 0.2s ease;
    }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg);
      color: var(--text-primary); padding-bottom: 80px; -webkit-font-smoothing: antialiased;
    }
    header {
      background: linear-gradient(135deg, var(--navy-deep) 0%, var(--navy) 100%);
      color: white; padding: 16px 20px; display: flex; justify-content: space-between;
      align-items: center;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 8px; background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center; font-weight: 700; color: white;
    }
    .logo-text { font-size: 1.3rem; font-weight: 700; }
    .status-pill {
      background: rgba(255,255,255,0.1); backdrop-filter: blur(8px);
      padding: 6px 14px; border-radius: 50px; font-size: 0.8rem; display: flex; align-items: center; gap: 6px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-dot.online { background: var(--success); }
    .status-dot.offline { background: var(--danger); }
    main { padding: 20px 16px; }
    .card {
      background: var(--card-bg); border-radius: var(--radius-lg); padding: 20px;
      box-shadow: var(--shadow-card);
    }
    .card-label {
      font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.8px; color: var(--text-secondary); margin-bottom: 12px;
    }
    .trade-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid #f5f5f5; font-size: 0.85rem; gap: 8px;
    }
    .trade-row:last-child { border-bottom: none; }
    .pnl-pill {
      padding: 3px 10px; border-radius: 20px; font-weight: 600; font-size: 0.8rem;
    }
    .pnl-pill.positive { background: rgba(46,204,113,0.1); color: var(--success); }
    .pnl-pill.negative { background: rgba(231,76,60,0.1); color: var(--danger); }
    nav {
      position: fixed; bottom: 0; left: 0; width: 100%; display: flex;
      background: rgba(255,255,255,0.85); backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px); box-shadow: 0 -2px 12px rgba(0,0,0,0.04);
      z-index: 100; padding: 8px 0; border-top: 1px solid rgba(0,0,0,0.04);
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; padding: 6px 0; text-decoration: none; color: var(--silver);
      font-size: 0.7rem; font-weight: 500; position: relative;
    }
    .nav-item svg { width: 24px; height: 24px; }
    .nav-item.active { color: var(--navy); }
    .nav-item.active::before {
      content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 32px; height: 3px; background: var(--navy); border-radius: 0 0 3px 3px;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <div class="logo-icon">⚓</div>
        <span class="logo-text">Anchor</span>
      </div>
      <div class="status-pill">
        <span class="status-dot online"></span> Demo
      </div>
    </header>

    <main>
      <div class="card">
        <div class="card-label">Trade History</div>
        <div id="historyList">
          <div class="trade-row"><span>2025-07-20 14:22</span><span>EUR/USD Long</span><span>Entry 1.1050 → Exit 1.1095</span><span class="pnl-pill positive">+$5.10</span></div>
          <div class="trade-row"><span>2025-07-20 08:30</span><span>EUR/USD Short</span><span>Entry 1.1020 → Exit 1.1045</span><span class="pnl-pill negative">-$3.80</span></div>
          <div class="trade-row"><span>2025-07-19 10:45</span><span>EUR/USD Long</span><span>Entry 1.1070 → Exit 1.1110</span><span class="pnl-pill positive">+$4.20</span></div>
        </div>
      </div>
    </main>

    <nav>
      <a href="./" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="./history.html" class="nav-item active">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>History</span>
      </a>
    </nav>
  </div>
</body>
</html>
