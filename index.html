<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F1A2E">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-72x72.png">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
  <title>Anchor Trading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <img src="/assets/logo.png" alt="Anchor" class="logo-icon" width="36" height="36">
        <span class="logo-text">Anchor</span>
      </div>
      <div class="status-pill" id="botStatus">
        <span class="status-dot offline"></span>
        <span class="status-text">Checking...</span>
      </div>
    </header>

    <main>
      <!-- Equity Card -->
      <div class="card equity-card">
        <div class="card-label">Total Equity</div>
        <div class="equity-value" id="equityValue">$0.00</div>
        <div class="equity-change" id="equityChange">
          <span class="change-value">--</span>
          <span class="change-pct">--</span>
        </div>
      </div>

      <!-- Open Trade Card -->
      <div class="card trade-card" id="openTradeCard" style="display:none;">
        <div class="card-label">
          Open Position
          <span class="live-badge">● LIVE</span>
        </div>
        <div class="trade-symbol" id="tradeInstrument">EUR/USD</div>
        <div class="trade-direction-pill" id="tradeDirection">Long</div>
        <div class="trade-prices">
          <div class="price-item">
            <span class="price-label">Entry</span>
            <span class="price-value" id="tradeEntry">--</span>
          </div>
          <div class="price-item">
            <span class="price-label">Stop Loss</span>
            <span class="price-value" id="tradeSL">--</span>
          </div>
          <div class="price-item">
            <span class="price-label">Take Profit</span>
            <span class="price-value" id="tradeTP">--</span>
          </div>
        </div>
        <div class="unrealized-pnl" id="tradeUnrealized">+$0.00</div>
      </div>

      <!-- KPI Cards -->
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-icon win-rate-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 12l2 2 4-4"/>
              <circle cx="12" cy="12" r="10"/>
            </svg>
          </div>
          <div class="kpi-value" id="kpiWinRate">--</div>
          <div class="kpi-label">Win Rate</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon sharpe-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
          </div>
          <div class="kpi-value" id="kpiSharpe">--</div>
          <div class="kpi-label">Sharpe</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon pf-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="20" x2="12" y2="10"/>
              <line x1="18" y1="20" x2="18" y2="4"/>
              <line x1="6" y1="20" x2="6" y2="16"/>
            </svg>
          </div>
          <div class="kpi-value" id="kpiPF">--</div>
          <div class="kpi-label">Profit Factor</div>
        </div>
      </div>

      <!-- Recent Trades -->
      <div class="card">
        <div class="card-label">Recent Trades</div>
        <div id="recentTradesList">
          <div class="trade-row placeholder">No trades yet.</div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="actions">
        <button id="notifBtn" class="btn btn-primary" style="display:none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          Enable Notifications
        </button>
        <button id="emergencyBtn" class="btn btn-danger" style="display:none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          Emergency Optimize
        </button>
      </div>
    </main>

    <nav>
      <a href="/" class="nav-item active">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        </svg>
        <span class="nav-label">Dashboard</span>
      </a>
      <a href="/history.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span class="nav-label">History</span>
      </a>
    </nav>
  </div>
  <script src="/app.js"></script>
</body>
</html>
